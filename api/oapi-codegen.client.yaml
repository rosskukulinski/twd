# oapi-codegen config: the Go client twd-hostd and the twd CLI use against /v1.
# Regenerate with `make api`; CI checks the output is current (`make api-check`).
package: v1
output: hostd/mgmtapi/v1/client.gen.go
generate:
  models: true
  client: true
output-options:
  nullable-type: true
  name-normalizer: ToCamelCaseWithInitialisms
  exclude-tags: [registry]
